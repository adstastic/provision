[project]
name = "mm"
version = "1.0.0"
description = "Lean Mac Mini management CLI"
readme = "README.md"
authors = [{ name = "adi", email = "hi@adim.in" }]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mm = "provision.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["provision"]

[dependency-groups]
dev = ["pytest>=8.4.1"]
